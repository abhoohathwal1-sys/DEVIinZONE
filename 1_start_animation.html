<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1. HATHWAL — DEVILinZONE</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/arcade.css" />
  <style>
    body { overflow: hidden; background: #000000; }

    /* STAGE 1: BGMI "KRAFTON" STYLE -> "HATHWAL" + "LIMITED EDITION" */
    #brand-stage {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      text-align: center;
      padding: 20px;
      transition: opacity 0.55s ease;
    }
    #brand-stage.fade-out { opacity: 0; pointer-events: none; }

    .brand-main {
      font-family: var(--font-display);
      font-size: clamp(28px, 8.5vw, 42px);
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.28), 4px 4px 0 #1f2937;
      opacity: 0;
      transform: scale(0.92);
      animation: brandIn 0.85s ease 0.2s forwards;
    }
    .brand-line {
      width: 0;
      height: 3px;
      background: #e6b422;
      margin: 14px auto 12px;
      animation: lineGrow 0.65s ease 0.65s forwards;
    }
    .brand-sub {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 4px;
      color: #e6b422;
      text-transform: uppercase;
      opacity: 0;
      animation: brandIn 0.7s ease 0.9s forwards;
    }
    @keyframes brandIn { to { opacity: 1; transform: scale(1); } }
    @keyframes lineGrow { to { width: 175px; } }

    /* STAGE 2: MINECRAFT-STYLE CINEMATIC GAME POSTER + PRESS TO START */
    #poster-stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 26px 18px 34px;
      background-color: #0e141c;
      background-image: url("assets/poster.jpg");
      background-size: cover;
      background-position: center;
      z-index: 5;
    }

    .poster-top {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      margin-top: 8px;
    }

    .poster-logo {
      font-family: var(--font-display);
      font-size: clamp(28px, 8.5vw, 38px);
      color: #ffe478;
      text-shadow:
        0 5px 0 #8a5609,
        4px 4px 0 #0c0f12,
        -3px -3px 0 #0c0f12,
        0 10px 26px rgba(0, 0, 0, 0.85);
      line-height: 1.15;
    }

    .poster-edition {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 2px;
      color: #7ee058;
      text-shadow: 2px 2px 0 #0c0f12;
      background: rgba(12, 18, 24, 0.75);
      border: 2px solid #0c0f12;
      padding: 6px 12px;
    }

    .poster-bottom {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .press-start-btn {
      width: 100%;
      font-size: 14px;
      padding: 18px 16px;
      animation: startPulse 1.4s steps(2) infinite;
    }

    @keyframes startPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.14); }
    }

    .footer-credit {
      font-family: var(--font-display);
      font-size: 8px;
      color: #d0dde8;
      text-shadow: 2px 2px 0 #0c0f12;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <!-- STAGE 1: HATHWAL / LIMITED EDITION -->
  <div id="brand-stage">
    <div class="brand-main">HATHWAL</div>
    <div class="brand-line"></div>
    <div class="brand-sub">LIMITED EDITION</div>
  </div>

  <!-- STAGE 2: MINECRAFT-STYLE POSTER + PRESS TO START -->
  <div id="poster-stage">
    <div class="poster-top">
      <span class="g-pill">HATHWAL LIMITED EDITION</span>
      <div class="poster-logo">DEVILinZONE</div>
      <div class="poster-edition">1 DEVIL vs 4 HIDERS • 3D ARENA</div>
    </div>

    <div class="poster-bottom">
      <button class="g-btn g-btn-green press-start-btn" id="btn-press-start">
        PRESS TO START
      </button>
      <div class="footer-credit">TAP BUTTON TO ENTER LOBBY</div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script>
    (function () {
      const brand = document.getElementById("brand-stage");
      const startBtn = document.getElementById("btn-press-start");
      let tBrand = null;

      function revealPoster() {
        clearTimeout(tBrand);
        brand.classList.add("fade-out");
        setTimeout(() => { brand.style.display = "none"; }, 550);
      }

      function boot() {
        clearTimeout(tBrand);
        brand.classList.remove("fade-out");
        brand.style.display = "flex";
        // Hold "HATHWAL / LIMITED EDITION" for 2.4s then reveal Minecraft Poster + PRESS TO START
        tBrand = setTimeout(revealPoster, 2400);
      }

      brand.onclick = () => {
        window.ZP_AUDIO.introChime();
        revealPoster();
      };

      startBtn.onclick = () => {
        window.ZP_AUDIO.introChime();
        setTimeout(() => { window.location.replace("2_lobby.html"); }, 140);
      };

      window.addEventListener("pageshow", boot);
      window.addEventListener("pagehide", () => clearTimeout(tBrand));
    })();
  </script>
</body>
</html>
