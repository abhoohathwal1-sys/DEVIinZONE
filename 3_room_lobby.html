<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3. DEVILinZONE — Match Room</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/arcade.css" />
  <style>
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .room-strip { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 8px; }
    .slots-wrap { display: flex; flex-direction: column; gap: 7px; max-height: 44dvh; overflow-y: auto; }
    .slot-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; background: #141c24; border: 3px solid #0c0f12; border-radius: 11px;
    }
    .slot-card.me { border-color: #f5b727; }
    .slot-left { display: flex; align-items: center; gap: 10px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body class="arena-bg">
  <div class="screen-wrap">
    <div class="top-bar">
      <button class="g-btn g-btn-dark g-btn-sm" id="btn-back"><span id="ico-back"></span> BACK</button>
      <span class="g-pill">ROOM #<span id="room-code">4829</span></span>
      <button class="g-btn g-btn-dark g-btn-sm" id="btn-copy">COPY</button>
    </div>

    <!-- Flexible 3-8 Player Roster -->
    <div class="g-panel" style="padding:10px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-family:var(--font-display); font-size:8.5px; color:#ffe07d;">
        <span>PLAYERS (<span id="p-count">1</span>/<span id="p-max">5</span>)</span>
        <span style="color:#83e66c;" id="mode-tag">REAL PLAY</span>
      </div>
      <div class="slots-wrap" id="slots-wrap"></div>
    </div>

    <!-- Background Arena Map Pre-Baker -->
    <div class="g-panel room-strip" style="background:#102920;">
      <div style="font-size:10.5px;">
        <div style="font-family:var(--font-display); font-size:8px; color:#83e66c;" id="map-prep-title">ARENA MAP READY</div>
        <div style="color:#b8d4c0; margin-top:3px;" id="map-prep-sub">Cropped zone + RPG props prepared</div>
      </div>
      <span class="g-pill" style="color:#83e66c;" id="map-prep-badge">OK</span>
    </div>

    <!-- Match Info Strip -->
    <div class="g-panel room-strip">
      <div style="font-size:10px;">
        <div style="font-family:var(--font-display); font-size:8px; color:#ffe07d;" id="match-meta">15m • 8s RADAR PING • MAX 2 EXPANDS</div>
        <div style="color:#a8c7d1; margin-top:3px;">Host-authoritative sync • 20s GPS grace</div>
      </div>
    </div>

    <!-- DEMO ONLY Controls (Hidden in Real Play!) -->
    <div class="two-col" id="demo-only-controls" style="display:none;">
      <button class="g-btn g-btn-dark g-btn-sm" id="btn-add-bot">+ ADD DEMO BOT</button>
      <button class="g-btn g-btn-dark g-btn-sm" id="btn-speed">SPEED: FAST</button>
    </div>

    <!-- REAL PLAY Ready Toggle (Visible in Real Play instead of Bot/Speed buttons!) -->
    <div id="real-ready-wrap" style="display:none;">
      <button class="g-btn g-btn-gold g-btn-lg" id="btn-toggle-ready" style="width:100%;">
        TAP TO READY UP
      </button>
    </div>

    <div style="margin-top:auto;">
      <button class="g-btn g-btn-green g-btn-lg" id="btn-start" style="width:100%;">
        <span id="ico-flask"></span> START MATCH
      </button>
    </div>
  </div>

  <script src="js/firebase_config.js"></script>
  <script src="js/firebase_sync.js"></script>
  <script src="js/pixel_art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script>
    const A = window.ZP_ART;
    document.getElementById("ico-back").innerHTML = A.icons.back;
    document.getElementById("ico-flask").innerHTML = A.icons.flask;

    let state = window.ZP_STATE.load();
    let busy = false;

    function prebakeMap() {
      window.ZP_STATE.prebakeArenaProps(state, state.arenaMap.anchorLat, state.arenaMap.anchorLng);
      document.getElementById("map-prep-sub").textContent = `Crop ${state.arenaMap.cropRadius}m • ${state.arenaMap.propCandidates.length} props ready`;
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(pos => {
          window.ZP_STATE.prebakeArenaProps(state, pos.coords.latitude, pos.coords.longitude);
          document.getElementById("map-prep-badge").textContent = "GPS OK";
        }, () => {}, { enableHighAccuracy: true, timeout: 7000 });
      }
    }

    function render() {
      busy = false;
      state = window.ZP_STATE.load();
      const maxP = Math.max(3, Math.min(8, state.maxPlayers || 5));
      document.getElementById("room-code").textContent = state.roomCode;
      document.getElementById("p-count").textContent = state.players.length;
      document.getElementById("p-max").textContent = maxP;
      document.getElementById("mode-tag").textContent = state.demoMode ? "DEMO MODE" : "REAL PLAY";
      document.getElementById("btn-speed").textContent = state.fastTimers ? "SPEED: FAST" : "SPEED: REAL";
      // FIX #1: Show Bot/Speed ONLY in Demo Mode; in Real Play show READY button for players!
      document.getElementById("demo-only-controls").style.display = state.demoMode ? "grid" : "none";
      document.getElementById("real-ready-wrap").style.display = (!state.demoMode && !state.isHost) ? "block" : "none";
      document.getElementById("btn-start").style.display = (state.isHost || state.demoMode) ? "inline-flex" : "none";

      const mePl = state.players.find(p => p.id === state.myId || (p.id === state.myId || p.id === "me" || p.isSelf) || p.isSelf);
      const rBtn = document.getElementById("btn-toggle-ready");
      if (mePl && rBtn) {
        rBtn.textContent = mePl.ready ? "READY ✓ (TAP TO UNREADY)" : "TAP TO READY UP";
        rBtn.className = mePl.ready ? "g-btn g-btn-green g-btn-lg" : "g-btn g-btn-gold g-btn-lg";
      }
      document.getElementById("match-meta").textContent = `${state.durationMin || 15}m • 8s PING • 20s GRACE`;

      const wrap = document.getElementById("slots-wrap");
      wrap.innerHTML = "";
      const visiblePlayers = state.players.filter(p => p && p.status !== "LEFT" && p.status !== "EXPIRED");
      document.getElementById("p-count").textContent = visiblePlayers.length;
      visiblePlayers.forEach((p, idx) => {
        const div = document.createElement("div");
        div.className = "slot-card" + ((p.id === state.myId || p.id === "me" || p.isSelf) ? " me" : "");
        div.innerHTML = `
          <div class="slot-left">
            ${A.charIMG("me", 36, p.spriteIdx ?? idx)}
            <div>
              <div style="font-family:var(--font-display); font-size:9px; color:${(p.id === state.myId || p.id === "me" || p.isSelf) ? "#ffe07d" : "#fff"};">
                ${p.name} ${(p.id === state.myId || p.id === "me" || p.isSelf) ? "(YOU)" : ""}
              </div>
              <div style="font-size:10px; color:#83e66c; margin-top:2px;">${p.isBot ? "DEMO BOT" : (p.isHost ? "HOST • READY" : "PLAYER • READY")}</div>
            </div>
          </div>
          <div>
            ${p.isBot ? `<button class="g-btn g-btn-red g-btn-sm" style="padding:5px 8px;" data-del="${idx}">X</button>` : `<span class="g-pill" style="color:${(p.isHost || p.ready) ? "#83e66c" : "#ffe07d"};">${(p.isHost || p.ready) ? "READY" : "WAIT"}</span>`}
          </div>`;
        wrap.appendChild(div);
      });

      for (let i = visiblePlayers.length; i < maxP; i++) {
        const empty = document.createElement("div");
        empty.className = "slot-card";
        empty.style.opacity = "0.55";
        empty.innerHTML = `<span style="font-size:10.5px; color:#a8c7d1;">SLOT #${i + 1} — Share Room #${state.roomCode} or + Add Bot</span>`;
        wrap.appendChild(empty);
      }

      wrap.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = () => {
          window.ZP_AUDIO.click();
          state.players.splice(parseInt(b.dataset.del, 10), 1);
          window.ZP_STATE.save(state);
          render();
        };
      });
    }

    document.getElementById("btn-toggle-ready").onclick = () => {
      window.ZP_AUDIO.click();
      const mePl = state.players.find(p => p.id === state.myId || (p.id === state.myId || p.id === "me" || p.isSelf) || p.isSelf);
      if (!mePl) return;
      mePl.ready = !mePl.ready;
      window.ZP_STATE.save(state);
      window.ZP_SYNC.setPlayerReady(state.roomCode, state.roomInstanceId, mePl.id, mePl.ready);
      render();
    };
    document.getElementById("btn-back").onclick = () => {
      window.ZP_AUDIO.click();
      if (!state.demoMode && window.ZP_SYNC.isEnabled() && state.roomCode && state.roomInstanceId) {
        window.ZP_SYNC.leaveRoomIntentionally(state.roomCode, state.roomInstanceId, state.myId, () => {
          window.ZP_STATE.clearActiveSession(state);
          window.location.href = "2_lobby.html";
        });
      } else {
        window.ZP_STATE.clearActiveSession(state);
        window.location.href = "2_lobby.html";
      }
    };
    document.getElementById("btn-copy").onclick = () => {
      window.ZP_AUDIO.click();
      try { if (navigator.clipboard) navigator.clipboard.writeText(state.roomCode); } catch (e) {}
      window.ZP_STATE.showToast("COPIED ROOM #" + state.roomCode);
    };
    document.getElementById("btn-add-bot").onclick = () => {
      const maxP = Math.max(3, Math.min(8, state.maxPlayers || 5));
      if (state.players.length >= maxP) { window.ZP_STATE.showToast("ROOM FULL!"); return; }
      window.ZP_AUDIO.click();
      state.demoMode = true;
      const b = window.ZP_STATE.createBot(state.players); state.players.push(b); window.ZP_SYNC.addBotToRoom(state.roomCode, b);
      window.ZP_STATE.save(state);
      render();
    };
    document.getElementById("btn-speed").onclick = () => {
      window.ZP_AUDIO.click();
      state.fastTimers = !state.fastTimers;
      window.ZP_STATE.save(state);
      render();
    };
    // Live Multi-Phone Firebase Authoritative Room Sync (v10)
    window.ZP_SYNC.init(ok => {
      if (!ok || state.demoMode || !state.roomCode) return;
      window.ZP_SYNC.bindPresence(state.roomCode, state.roomInstanceId, state.myId, "LOBBY");
      window.ZP_SYNC.joinRoomListener(state.roomCode, room => {
        if (!room || !room.meta || (state.roomInstanceId && room.meta.roomInstanceId !== state.roomInstanceId) || room.meta.status === "CLOSED") {
          window.ZP_STATE.showToast("ROOM CLOSED!");
          window.ZP_STATE.clearActiveSession(state);
          window.ZP_SYNC.leaveRoomListener();
          setTimeout(() => { window.location.href = "2_lobby.html"; }, 900);
          return;
        }
        state.roomInstanceId = room.meta.roomInstanceId;
        state.isHost = room.meta.hostId === state.myId;
        state.durationMin = room.meta.durationMin || state.durationMin;
        state.maxPlayers = room.meta.maxPlayers || state.maxPlayers;
        state.startRadius = room.meta.startRadius || state.startRadius;
        if (room.players) {
          state.players = Object.values(room.players).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
          state.players.forEach(p => { if (p.id === state.myId) p.isSelf = true; });
        }
        window.ZP_STATE.save(state);
        render();

        // When Host atomically starts match (IN_MATCH + ACTIVE), ALL phones launch 4_game.html with same matchId!
        if (room.meta.status === "IN_MATCH" && room.match && room.match.status === "ACTIVE" && !busy) {
          busy = true;
          state.matchId = room.match.matchId;
          state.syncedDevilId = room.match.devilId || "";
          if (room.arenaMap && room.arenaMap.ready) state.arenaMap = room.arenaMap;
          window.ZP_STATE.setActiveSession(state, {
            roomCode: state.roomCode,
            roomInstanceId: state.roomInstanceId,
            matchId: state.matchId,
            screen: "game"
          });
          window.location.href = "4_game.html";
        }
      });
    });

    document.getElementById("btn-start").onclick = () => {
      if (busy) return;
      const activeList = state.players.filter(p => p && p.status !== "LEFT" && p.status !== "EXPIRED");
      if (!state.isHost && window.ZP_SYNC.isEnabled() && !state.demoMode) {
        window.ZP_STATE.showToast("WAITING FOR HOST TO START!");
        return;
      }
      if (activeList.length < 3) {
        window.ZP_STATE.showToast("MIN 3 PLAYERS NEEDED!");
        return;
      }
      busy = true;
      window.ZP_AUDIO.click();
      const dIdx = window.ZP_STATE.pickDevilIndex(activeList, state.roleMode || "random");
      const devilId = activeList[dIdx].id;

      if (window.ZP_SYNC.isEnabled() && !state.demoMode) {
        window.ZP_SYNC.startMatchHost(state.roomCode, state.roomInstanceId, state.myId, devilId, state.arenaMap, (ok, res) => {
          if (!ok) {
            busy = false;
            window.ZP_STATE.showToast(res || "COULD NOT START!");
            return;
          }
          state.matchId = res.matchId;
          state.syncedDevilId = res.devilId;
          window.ZP_STATE.setActiveSession(state, {
            roomCode: state.roomCode,
            roomInstanceId: state.roomInstanceId,
            matchId: res.matchId,
            screen: "game"
          });
          window.location.href = "4_game.html";
        });
      } else {
        state.matchId = window.ZP_STATE.genUniqueId("m");
        state.syncedDevilId = devilId;
        window.ZP_STATE.save(state);
        window.location.href = "4_game.html";
      }
    };

    window.addEventListener("pageshow", () => { render(); prebakeMap(); });
    window.addEventListener("pagehide", () => { window.ZP_SYNC.leaveRoomListener(); });
  </script>
</body>
</html>
